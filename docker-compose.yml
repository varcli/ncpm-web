services:
  panel:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: ncpm-panel
    restart: unless-stopped
    ports:
      # Panel WebUI
      - "8098:8098"
      # Proxied HTTP/HTTPS traffic
      - "80:80"
      - "443:443"
      # TCP/UDP stream hosts need their listen ports published here as well,
      # e.g. - "5432:5432"
    volumes:
      - ./deploy/data:/app/data
      # The socket must be read-write for Compose to create/start/stop containers.
      # For untrusted networks, front this with a restricted Docker socket proxy.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8098
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8098/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
