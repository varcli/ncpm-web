name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore dependencies
        run: dotnet restore Ncpm.slnx

      - name: Build release
        run: dotnet build Ncpm.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Ncpm.slnx --configuration Release --no-build --logger trx

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --file deploy/Dockerfile --tag ncpm:ci .

      - name: Smoke test panel assets
        shell: bash
        run: |
          docker run --detach --name ncpm-ci --publish 127.0.0.1:18098:8098 ncpm:ci
          trap 'docker logs ncpm-ci; docker rm --force ncpm-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --output /dev/null \
              http://127.0.0.1:18098/_framework/blazor.server.js; then
              exit 0
            fi
            sleep 2
          done
          echo "Blazor bootstrap asset did not become available" >&2
          exit 1
