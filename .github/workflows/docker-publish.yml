name: Docker Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "额外的 Docker 镜像标签；主版本固定使用 yyyyMMdd 日期"
        required: false
        type: string
        default: ""
      publish_latest:
        description: "同时更新 latest 标签"
        required: true
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore and test
        run: |
          dotnet restore Ncpm.slnx
          dotnet test Ncpm.slnx --configuration Release --no-restore

  build-and-push:
    name: Build and push multi-arch image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(TZ=Asia/Shanghai date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.image.outputs.version }},priority=900
            type=raw,value=${{ inputs.tag }},priority=800,enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
            type=raw,value=latest,priority=700,enable=${{ (github.event_name == 'workflow_dispatch' && inputs.publish_latest) || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=NCPM
            org.opencontainers.image.description=.NET Nginx、SSL 与 Docker 管理面板
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Write job summary
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Docker image published"
            echo
            echo "- Image: \`$IMAGE_NAME\`"
            echo "- Version: \`$IMAGE_VERSION\`"
            echo "- Platforms: \`linux/amd64, linux/arm64\`"
            echo "- Digest: \`$IMAGE_DIGEST\`"
            echo
            echo "### Tags"
            echo '```text'
            printf '%s\n' "$IMAGE_TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
